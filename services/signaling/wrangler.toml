# Sinalização do SquadView: só troca endereços para os membros se conectarem.
# Nenhum vídeo passa por aqui (ver docs/adr/0003-sinalizacao-cloudflare-worker.md).
name = "squadview-signaling"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Registro de cada pessoa: amigos e presença (ver docs/adr/0011-amigos-e-presenca.md).
# O segredo das sessões fica fora do repositório: `wrangler secret put SESSION_SECRET`.
# Repassador TURN para quem está atrás de CGNAT (ver docs/adr/0014-conexao-em-camadas.md), opcional e
# plugável (`wrangler secret put <NOME>`), o primeiro completo vale:
# - Cloudflare Realtime: TURN_KEY_ID e TURN_KEY_API_TOKEN;
# - Metered (grátis, 20 GB/mês): METERED_DOMAIN (ex.: squadview.metered.live) e METERED_API_KEY;
# - servidor fixo (coturn próprio): TURN_URLS (separadas por vírgula), TURN_USERNAME e TURN_CREDENTIAL.
# Sem nenhum, a sala funciona só com conexão direta.
[[durable_objects.bindings]]
name = "USERS"
class_name = "User"

# Servidores com salas fixas (ver docs/adr/0016-servidores-e-salas-fixas.md).
[[durable_objects.bindings]]
name = "SERVERS"
class_name = "Server"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["User"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Server"]
