version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      # O windows-core anda junto com o crate windows: subir só um quebra a build.
      windows:
        patterns: ["windows", "windows-core"]
      rust:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      javascript:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # O typescript-eslint ainda não suporta o TypeScript 7.
      - dependency-name: typescript
        versions: [">=7"]
