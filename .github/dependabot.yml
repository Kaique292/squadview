version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      # O windows-core anda junto com o crate windows: subir só um quebra a build.
      windows:
        patterns: ["windows", "windows-core"]
      rust:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Nos crates 0.x, subir o segundo número (0.62 → 0.100) quebra a API. A migração do
      # windows é feita de propósito, junto com o Tauri; aqui só entram as correções.
      - dependency-name: "windows*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      javascript:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # O typescript-eslint ainda não suporta o TypeScript 7.
      - dependency-name: typescript
        versions: [">=7"]
