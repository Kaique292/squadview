name: Verificação

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  qualidade:
    name: Formatação e commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - name: Prettier
        run: yarn prettier --check .

      - name: Mensagens de commit (padrão semântico, sem coautor)
        if: github.event_name == 'pull_request'
        run: yarn commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Título do PR (vira o commit do squash)
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | yarn commitlint --verbose

      - name: rustfmt
        run: cargo fmt --all --check

  dependencias:
    name: Licenças e vulnerabilidades (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  rust:
    name: Rust (clippy, testes e cobertura)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No Windows o corepack precisa ser ligado no Node que o setup-node instala; só depois
      # disso o cache do Yarn 4 funciona (antes ele acha o Yarn 1 global e falha).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      # O Tauri confere na compilação que a interface já foi gerada.
      - name: Interface (dist)
        run: yarn workspace @squadview/desktop build

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Testes com cobertura
        run: yarn test:rs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-rust
          path: build/coverage-rust.json

  typescript:
    name: Interface e sinalização (lint e testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - name: ESLint e TypeScript
        run: yarn lint:js

      - name: Testes com cobertura
        run: yarn test:js

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-typescript
          path: |
            build/coverage-desktop/coverage-summary.json
            build/coverage-signaling/coverage-summary.json

  badge:
    name: Badge de cobertura
    needs: [rust, typescript]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: build
          merge-multiple: true

      - name: Calcular cobertura
        run: node scripts/coverage-badge.mjs build/badges/coverage.json

      # A badge fica numa branch própria para não gerar commits na main.
      - name: Publicar na branch badges
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin badges; then
            git worktree add -B badges /tmp/badges origin/badges
          else
            git worktree add --orphan -b badges /tmp/badges
          fi
          cp build/badges/coverage.json /tmp/badges/coverage.json
          cd /tmp/badges
          git add coverage.json
          git diff --cached --quiet || git commit -m "chore: atualiza badge de cobertura"
          git push origin badges

  instalador:
    name: Instalador de teste
    # Na dev e no PR da dev para a main (antes de cada versão).
    if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || (github.event_name == 'pull_request' && github.base_ref == 'main')
    needs: [rust, typescript]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No Windows o corepack precisa ser ligado no Node que o setup-node instala; só depois
      # disso o cache do Yarn 4 funciona (antes ele acha o Yarn 1 global e falha).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Gerar instalador
        env:
          SQUADVIEW_SIGNALING_URL: wss://squadview-signaling.squadview.workers.dev
        run: yarn build

      # Instala, abre duas vezes e "atualiza" com o app de verdade; falha se o app cair.
      - name: Teste de fumaça do instalador
        shell: pwsh
        # Leva uns 2 minutos; se travar, falha em vez de prender a esteira por horas.
        timeout-minutes: 10
        run: ./scripts/smoke-installer.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: squadview-dev-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          retention-days: 14
