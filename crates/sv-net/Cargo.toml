[package]
name = "sv-net"
description = "Transporte P2P sobre QUIC: STUN, hole punching, certificados por fingerprint e envio de mídia."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
bytes = "1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
# Credencial do TURN (RFC 8656): chave MD5 e HMAC-SHA1 (o ring já vem com o rustls).
md5 = { package = "md-5", version = "0.11" }
postcard = { version = "1", features = ["use-std"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rcgen = "0.14"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde.workspace = true
serde_json = "1"
sha2 = "0.11"
sv-gpu.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }

[dev-dependencies]
# Testes de integração dos amigos: assinam sessões como o Worker (HMAC-SHA256, base64url).
base64 = "0.23"

[lints]
workspace = true
